<!DOCTYPE html>
<html>
<head>
  <title>Halaman Saya</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: linear-gradient(to right, #74ebd5, #ACB6E5);
      margin: 0;
      padding: 0;
    }

    .container {
      background-color: white;
      margin: 50px auto;
      padding: 30px;
      width: 80%;
      max-width: 500px;
      border-radius: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    .logo {
      width: 100px;
      margin-bottom: 15px;
    }

    h1 {
      color: red;
      margin-bottom: 10px;
    }

    p {
      font-size: 18px;
    }

    .garis {
      border-bottom: 2px solid black;
      display: inline-block;
      padding-bottom: 5px;
      margin-bottom: 15px;
    }

    .link {
      display: block;
      margin: 10px auto;
      padding: 10px;
      width: 70%;
      text-decoration: none;
      color: white;
      background-color: #007BFF;
      border-radius: 8px;
      transition: 0.3s;
    }

    .link:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- LOGO -->
    <img src="logo manem.jpg" alt="Logo Sekolah" class="logo">

    <h1>Halo SMAN 56!</h1>
    
    <p class="garis">Belajar web itu seru.</p>

    <a class="link" href="https://www.google.com" target="_blank">Google</a>
    <a class="link" href="https://www.youtube.com" target="_blank">YouTube</a>
    <a class="link" href="https://sman56best.gt.tc/ptsps562/" target="_blank">PTSP 56</a>

  </div>

</body>
</html>
